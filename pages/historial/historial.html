<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial - POWER APP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- en <head> -->
    <link rel="icon" href="/iconos/world.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="../../css/general.css">
    <link rel="stylesheet" href="../../css/historial.css">
</head>

<body>

    <header>
        <h1>POWER APP</h1>
        <nav>
            <i class="fa-solid fa-house"></i> <a href="/pages/dashboard/dashboard.html"> Dashboard </a>
            <i class="fa-solid fa-user-plus"></i> <a href="/pages/registros/registro.html"> Registrar Sesión </a>
            <i class="fa-solid fa-dumbbell"></i> <a href="/pages/bloque/bloques.html"> Mis Bloques </a>
            <i class="fa-solid fa-gears"></i><a href="/pages/tecnicas/tecnica.html"> Técnica </a>
            <i class="fa-solid fa-clock-rotate-left"></i><a href="/pages/historial/historial.html"> Historial </a>
        </nav>

        <div>
            <p id="nombre-usuario-header">Cargando...</p>
            <form class="form-cerrar-sesion" action="../../index.html">
                <button type="submit">Cerrar sesión</button>
            </form>
        </div>
    </header>

    <main>

        <header>
            <h1>Historial de Entrenamientos</h1>
            <p>Tus últimos registros guardados</p>
        </header>

        <section id="panel-historial">

            <!-- NUEVO: Barra de controles -->
            <div class="controles-historial">
                <input type="text" id="buscador-historial" class="input-general"
                    placeholder="Buscar por movimiento o nota...">

                <select id="filtro-movimiento" class="input-general">
                    <option value="">Todos los movimientos</option>
                    <option value="squat">Sentadilla</option>
                    <option value="bench">Press de banca</option>
                    <option value="deadlift">Peso muerto</option>
                </select>

                <select id="filtro-rpe" class="input-general">
                    <option value="">Cualquier RPE</option>
                    <option value="bajo">RPE menor a 8</option>
                    <option value="alto">RPE 8 o más</option>
                </select>

                <select id="orden-historial" class="input-general">
                    <option value="fecha-desc">Más reciente primero</option>
                    <option value="fecha-asc">Más antiguo primero</option>
                    <option value="peso-desc">Mayor peso primero</option>
                    <option value="peso-asc">Menor peso primero</option>
                </select>
            </div>

            <button id="btn-restablecer-datos" class="btn-restablecer">
                <i class="fa-solid fa-arrows-rotate"></i> Restablecer datos originales
            </button>

            <table class="tabla-registros">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Movimiento</th>
                        <th>Peso (kg)</th>
                        <th>Series x Reps</th>
                        <th>RPE</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla-historial">
                    <!-- JavaScript insertará las filas dinámicamente aquí -->
                </tbody>
            </table>

        </section>
        <br>

    </main>
    <!-- antes de storage.js -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <script src="../../js/storage.js"></script>
    <script src="../../js/datos.js"></script>
    <script src="../../js/componentes.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/crud.js"></script> <!-- NUEVO -->
    <script src="../../js/filtros.js"></script> <!-- NUEVO -->
    <script src="../../js/api.js"></script>
    <script src="../../js/grafico.js"></script>
    <script src="../../js/main.js"></script>

</body>

</html>
