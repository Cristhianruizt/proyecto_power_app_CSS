<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Técnica - POWER APP</title>
    
    <link rel="icon" href="/iconos/weight.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/general.css">
    <link rel="stylesheet" href="../../css/tecnica.css">
</head>

<body>

    <header>
        <h1>POWER APP</h1>
        <nav>
            <i class="fa-solid fa-house"></i> <a href="/pages/dashboard/dashboard.html"> Dashboard </a>
            <i class="fa-solid fa-user-plus"></i> <a href="/pages/registros/registro.html"> Registrar Sesión </a>
            <i class="fa-solid fa-dumbbell"></i> <a href="/pages/bloque/bloques.html"> Mis Bloques </a>
            <i class="fa-solid fa-gears"></i><a href="/pages/tecnicas/tecnica.html"> Técnica </a>
            <i class="fa-solid fa-clock-rotate-left"></i><a href="/pages/historial/historial.html"> Historial </a>
        </nav>
        <div>
             <div>
            <p id="nombre-usuario-header">Cargando...</p>
            <form class="form-cerrar-sesion" action="../../index.html">
                <button type="submit">Cerrar sesión</button>
            </form>
        </div>
    </header>

    <main id="contenedor-tecnicas">

        <header>
            <h1>Técnica de Competición</h1>
            <p>Estándares y ejecución de los 3 grandes</p>
        </header>

        <div id="carruselLevantamientos" class="carousel slide mb-5 mx-auto" data-bs-ride="false"
            style="max-width: 600px; border: 3px solid #e53935; border-radius: 8px; overflow: hidden;">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carruselLevantamientos" data-bs-slide-to="0" class="active"
                    aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#carruselLevantamientos" data-bs-slide-to="1"
                    aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#carruselLevantamientos" data-bs-slide-to="2"
                    aria-label="Slide 3"></button>
            </div>

            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="../../img/squat.png" class="d-block w-100" alt="Low-bar Squat">
                    <div class="carousel-caption">
                        <h5>Low-bar Squat</h5>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="../../img/bench.png" class="d-block w-100" alt="Bench Press">
                    <div class="carousel-caption">
                        <h5>Bench Press</h5>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="../../img/deadlift.png" class="d-block w-100" alt="Sumo Deadlift">
                    <div class="carousel-caption">
                        <h5>Sumo Deadlift</h5>
                    </div>
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carruselLevantamientos"
                data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carruselLevantamientos"
                data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Siguiente</span>
            </button>
        </div>

        <!-- CONTENEDOR VACÍO PARA INYECCIÓN DINÁMICA DE JAVASCRIPT -->
        <div id="contenedor-tarjetas-tecnica">
            <!-- JavaScript inyectará cada <article> aquí leyendo los datos y las rutas de videos del JSON -->
        </div>

        <hr>

        <article id="tutorial-destacado">
            <h2>Video Tutorial Recomendado</h2>
            <p>Errores comunes en el Powerlifting</p>

            <iframe class="video-youtube" src="https://www.youtube.com/embed/F91KfDdUGQ8?si=Ss95QZvn0UqnmvOk"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </article>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../../js/storage.js"></script>
    <script src="../../js/datos.js"></script>
    <script src="../../js/componentes.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/crud.js"></script> <!-- NUEVO -->
    <script src="../../js/filtros.js"></script> <!-- NUEVO -->
    <script src="../../js/api.js"></script>
    <script src="../../js/grafico.js"></script>
    <script src="../../js/main.js"></script>
</body>

</html>
